<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI - المساعد الذكي الخارق</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #020617; color: #f8fafc; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(56, 189, 248, 0.2); }
        .ai-glow { box-shadow: 0 0 40px rgba(14, 165, 233, 0.15); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-6">

    <!-- Top Navigation -->
    <header class="w-full max-w-5xl flex justify-between items-center pb-4 mb-4 border-b border-slate-800">
        <div class="flex items-center gap-3">
            <div class="bg-sky-500 text-slate-950 font-black p-2.5 rounded-2xl text-xl shadow-lg">⚡ NEXUS</div>
            <span class="text-sm font-bold text-sky-400">الذكاء الاصطناعي الجيل القادم</span>
        </div>
        <div class="flex items-center gap-3">
            <div class="bg-amber-950/80 border border-amber-500/40 px-4 py-1.5 rounded-2xl text-amber-300 font-bold text-sm">
                💎 رصيد التوكنز: <span id="tokens">1,000</span>
            </div>
            <button onclick="buyMoreTokens()" class="bg-gradient-to-r from-sky-500 to-indigo-600 hover:scale-105 text-white font-black px-4 py-2 rounded-2xl text-xs shadow-lg transition">
                شحن رصيد الأرباح 🚀
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="w-full max-w-5xl glass-panel rounded-3xl p-6 ai-glow grid grid-cols-1 md:grid-cols-4 gap-6 flex-grow">
        
        <!-- Sidebar Options -->
        <div class="flex flex-col gap-3 border-b md:border-b-0 md:border-l border-slate-800 pb-4 md:pb-0 md:pl-6">
            <h3 class="text-xs font-black text-slate-400 uppercase tracking-wider mb-2">أقسام الذكاء الاصطناعي</h3>
            <button onclick="switchTab('chat')" id="tab-chat" class="p-3 bg-sky-950/60 border border-sky-500/50 rounded-2xl text-right font-bold text-sky-200 transition flex items-center gap-3">
                <span>💬</span> المحادثة الذكية الشاملة
            </button>
            <button onclick="switchTab('image')" id="tab-image" class="p-3 bg-slate-900/60 border border-slate-800 rounded-2xl text-right font-bold text-slate-300 hover:bg-slate-800 transition flex items-center gap-3">
                <span>🎨</span> توليد الصور الخارقة
            </button>
            <button onclick="switchTab('code')" id="tab-code" class="p-3 bg-slate-900/60 border border-slate-800 rounded-2xl text-right font-bold text-slate-300 hover:bg-slate-800 transition flex items-center gap-3">
                <span>💻</span> مبرمج الأكواد الآلي
            </button>
            <button onclick="switchTab('business')" id="tab-business" class="p-3 bg-slate-900/60 border border-slate-800 rounded-2xl text-right font-bold text-slate-300 hover:bg-slate-800 transition flex items-center gap-3">
                <span>📈</span> محلل ومخطط المشاريع المليارية
            </button>
        </div>

        <!-- Content Arena -->
        <div class="md:col-span-3 flex flex-col justify-between space-y-4">
            
            <!-- Output / Screen Area -->
            <div id="ai-output" class="bg-slate-950/90 border border-slate-800 rounded-2xl p-5 min-h-[350px] max-h-[450px] overflow-y-auto text-slate-200 text-sm leading-relaxed space-y-4">
                <div class="p-3 bg-sky-950/40 border border-sky-900/50 rounded-xl">
                    مرحباً بكِ في نظام **Nexus AI**. أنا مبرمج لتوليد الحلول، الأكواد، وتحليل المشاريع الضخمة التي تدر عليكِ أرباحاً طائلة. كيف أساعدكِ اليوم؟
                </div>
            </div>

            <!-- Input & Action Bar -->
            <div class="flex gap-2">
                <input type="text5" id="user-input" placeholder="اكتبي طلبكِ هنا (مثلاً: اصنع لي خطة مشروع ملياريه)..." class="flex-grow bg-slate-900 border border-slate-700 focus:border-sky-500 rounded-2xl px-4 py-3 text-sm text-slate-100 focus:outline-none transition">
                <button onclick="processAIRequest()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-black px-6 py-3 rounded-2xl transition shadow-lg">
                    إرسال ⚡
                </button>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-5xl text-center pt-4 text-xs text-slate-500">
        Nexus AI Super Engine &copy; 2026 - نظام الذكاء الاصطناعي المالي المتطور
    </footer>

    <script>
        let currentSection = 'chat';
        let userTokens = 1000;

        function switchTab(section) {
            currentSection = section;
            ['chat', 'image', 'code', 'business'].forEach(s => {
                const btn = document.getElementById(`tab-${s}`);
                if(s === section) {
                    btn.className = "p-3 bg-sky-950/60 border border-sky-500/50 rounded-2xl text-right font-bold text-sky-200 transition flex items-center gap-3";
                } else {
                    btn.className = "p-3 bg-slate-900/60 border border-slate-800 rounded-2xl text-right font-bold text-slate-300 hover:bg-slate-800 transition flex items-center gap-3";
                }
            });

            const output = document.getElementById('ai-output');
            if(section === 'chat') output.innerHTML = `<div class="p-3 bg-sky-950/40 border border-sky-900/50 rounded-xl">أهلاً بكِ في قسم المحادثة الذكية. اطرحي أي سؤال وسأقوم بتحليله فوراً!</div>`;
            if(section === 'image') output.innerHTML = `<div class="p-3 bg-indigo-950/40 border border-indigo-900/50 rounded-xl">🎨 قسم توليد الصور الخارقة مفعل. اكتبي وصف الصورة المطلوبة لتحويلها لواقع رقمي.</div>`;
            if(section === 'code') output.innerHTML = `<div class="p-3 bg-emerald-950/40 border border-emerald-900/50 rounded-xl">💻 قسم برمجة التطبيقات والمواقع جاهز لكتابة آلاف الأسطر البرمجية بدقة متناهية.</div>`;
            if(section === 'business') output.innerHTML = `<div class="p-3 bg-amber-950/40 border border-amber-900/50 rounded-xl">📈 محلل المشاريع المليارية: جاهز لبناء استراتيجيات التسويق والأرباح الخيالية.</div>`;
        }

        function buyMoreTokens() {
            userTokens += 5000;
            document.getElementById('tokens').innerText = userTokens.toLocaleString();
            alert("✨ تم شحن رصيد التوكنز بنجاح عبر نظام المدفوعات والاشتراكات!");
        }

        function processAIRequest() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if(!text) return;

            const output = document.getElementById('ai-output');
            
            // عرض رسالة المستخدم
            output.innerHTML += `<div class="p-3 bg-slate-900 border border-slate-800 rounded-xl text-left text-sky-300"><b>أنتِ:</b> ${text}</div>`;
            inputField.value = '';

            // محاكاة استجابة ذكاء اصطناعي عملاقة وخارقة
            setTimeout(() => {
                let aiReply = `جاري معالجة طلبكِ عبر خوارزميات Nexus العميقة... بناءً على مدخلاتكِ، تم تصميم النموذج البرمجي والمالي بنجاح لتحقيق أعلى عوائد أرباح ممكنة، مع تحسين كافة تفاصيل الواجهة لتكون مبهرة وجذابة للمستخدمين حول العالم.`;
                if(currentSection === 'code') {
                    aiReply = `💻 تم توليد الكود البرمجي الخارق بنجاح:\n\n\`\`@app.route('/deploy_billion')\ndef billion_machine():\n    return 'System Optimized for Massive Revenue & Global Scale!'\`\`\n\nهذا الكود مصمم للعمل بسرعة فائقة وتحقيق أرباح ضخمة دون أخطاء!`;
                } else if(currentSection === 'business') {
                    aiReply = `📈 دراسة جدوى المشروع الملياري:\n1. استهداف الجمهور العالمي عبر دعم الإنجليزية والفرنسية.\n2. دمج إعلانات AdMob والاشتراكات الشهرية المدفوعة.\n3. نسبة النجاح المتوقعة: 99.8% بناءً على مؤشرات السوق الرقمي الحالي!`;
                }

                output.innerHTML += `<div class="p-3 bg-sky-950/30 border border-sky-800/40 rounded-xl text-slate-100"><b>Nexus AI:</b> ${aiReply}</div>`;
                output.scrollTop = output.scrollHeight;
            }, 800);
        }
    </script>
</body>
</html>
